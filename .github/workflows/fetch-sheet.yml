name: Scarica foglio competitor

on:
  # Ogni 6 ore: tiene aggiornata la mappa di brand positioning
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - .github/workflows/fetch-sheet.yml
      - scripts/build_live.py
      - scripts/build_apify.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica XLSX e CSV dal Google Sheet
        run: |
          set -e
          ID=1OYE99P9p7eclBhjWjH-rRodN5KNaJnoJKmxX0zTSKTY
          mkdir -p data
          curl -fsSL -o data/competitor-2026.xlsx "https://docs.google.com/spreadsheets/d/$ID/export?format=xlsx"
          curl -fsSL -o data/competitor-2026.csv "https://docs.google.com/spreadsheets/d/$ID/export?format=csv&gid=689605812"
          ls -la data
      - name: Genera i dati live per la pagina
        run: |
          pip install --quiet openpyxl
          python scripts/build_live.py data/competitor-2026.xlsx live/positioning.json
      - name: Post LinkedIn da Apify
        # Con il secret APIFY_TOKEN e la variabile APIFY_TASK_ID legge l'ultima esecuzione del task;
        # altrimenti il dataset indicato. Se Apify non risponde si tengono i dati precedenti.
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK_ID: ${{ vars.APIFY_TASK_ID }}
          APIFY_DATASET_ID: ${{ vars.APIFY_DATASET_ID || 'zLVyM2B45EZtMHXOX' }}
        run: python scripts/build_apify.py live/linkedin.json || echo "Apify non disponibile, continuo con i dati del foglio"
      - name: Commit dei dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data live
          git diff --cached --quiet || git commit -m "Dati competitor 2026 dal Google Sheet"
          git push
